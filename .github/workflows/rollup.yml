name: CCCS rollup

on:
  schedule:
    # Tuesdays 06:00 UTC — after the Monday 06:00 UTC weekly college runs
    - cron: "0 6 * * 2"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rollup:
    name: Fetch + render
    runs-on: ubuntu-latest
    steps:
      - name: Check out rollup tooling
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch latest reports and render dashboard
        run: node build-rollup.mjs --out docs

      - name: Commit + push to main (GitHub Pages)
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          if git diff --cached --quiet; then
            echo "No changes to publish."
          else
            git commit -m "rollup: render $(date -u +%Y-%m-%d)"
            git push origin HEAD:main
          fi
